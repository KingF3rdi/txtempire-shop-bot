plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.8.7'
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"txtempire-mc-watcher" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.findProperty("modrinth_id") ?: "txtempire-mc-watcher"
	versionNumber = project.version.toString()
	versionName = "TxTEmpire MC Watcher ${project.version}"
	versionType = "release"
	uploadFile = remapJar
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	changelog = """
## ${project.version}
- Chat-Watcher für Discord Shop Bot (Link-Codes + Payments)
- Link per `/msg TxTEmpire !link CODE`
- Fabric Loader >= 0.19.3
""".stripIndent().trim()
	dependencies {
		required.project "fabric-api"
	}
}
